name: Build Android APK

# Runs only when you tap "Run workflow" in the Actions tab,
# so normal edits don't trigger it. Your website deploy is separate.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --legacy-peer-deps

      - name: Type check (reports errors but does not block the APK)
        run: npm run lint
        continue-on-error: true

      - name: Build web app
        run: npm run build

      - name: Create Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Add the home-screen widget
        run: node scripts/apply-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: timetablegrid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
